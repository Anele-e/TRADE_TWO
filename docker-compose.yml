version: '3.8'
services:
  postgres:
    container_name: dev_postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DEV_DB_USER}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD}
      POSTGRES_DB: ${DEV_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  test_postgres:
    container_name: test_postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: ${TEST_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - test_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: dev_backend
    restart: always
    command:
      - sh
      - -c
      - |
        until pg_isready -h postgres -p 5432; do
          echo 'Waiting for postgres...'
          sleep 1
        done &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    volumes:
      - ./backend:/backend/:cached
      - ./.docker/.ipython:/root/.ipython:cached
    environment:
      PYTHONUNBUFFERED: 1 #For logs to appear in docker imediately
      DATABASE_URL_SYNC: "postgresql+psycopg2://${DEV_DB_USER}:${DEV_DB_PASSWORD}@postgres:5432/${DEV_DB_NAME}"
      DATABASE_URL_ASYNC: "postgresql+asyncpg://${DEV_DB_USER}:${DEV_DB_PASSWORD}@postgres:5432/${DEV_DB_NAME}"
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - "postgres"
    ports:
      - 8000:8000

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    stdin_open: true
    volumes:
      - "./frontend:/app:cached"
      - "/app/node_modules"
    environment:
      - NODE_ENV=development
    ports:
      - 5173:5173

volumes:
  pgdata:
  test_pgdata: